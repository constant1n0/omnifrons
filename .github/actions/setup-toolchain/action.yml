name: Setup toolchain
description: >-
  Shared Rust + Node/pnpm toolchain setup used by ci.yml and tauri-build.yml,
  so the two workflows do not drift on how each language toolchain is installed.

inputs:
  linux-prereqs:
    description: Install the Tauri Linux build prerequisites (apt packages) on ubuntu runners.
    required: false
    default: 'false'
  extra-apt-packages:
    description: Extra apt packages to install alongside the Tauri prerequisites (space-separated).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Linux prerequisites
      if: runner.os == 'Linux' && inputs.linux-prereqs == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev ${{ inputs.extra-apt-packages }}

    - name: Install Rust toolchain
      # Guarded on rust-toolchain.toml existing: the Rust steps only activate once the
      # toolchain file is present in the repository (kept consistent everywhere this
      # guard appears, per docs/repository-layout.md's toolchain-pins description).
      if: hashFiles('rust-toolchain.toml') != ''
      shell: bash
      run: |
        rustup toolchain install
        rustup show active-toolchain

    - name: Cache Rust
      if: hashFiles('rust-toolchain.toml') != ''
      # TODO: pin by SHA once this workflow stabilizes
      uses: Swatinem/rust-cache@v2 # v2

    - name: Setup Node
      # TODO: pin by SHA once this workflow stabilizes
      # Node comes from .node-version. pnpm is installed below with npm so the
      # same path works on ubuntu, macos, and windows runners: pnpm/setup@v2
      # hung for 30 minutes downloading pnpm on windows-latest (run 33984923790),
      # and pnpm/action-setup is documented for pnpm <= 10 only.
      uses: actions/setup-node@v7 # v7
      with:
        node-version-file: .node-version

    - name: Install pnpm
      shell: bash
      # The exact pnpm version is read from package.json's packageManager field,
      # the single place it is pinned (docs/repository-layout.md, toolchain pins).
      # pnpm is then invoked only through a wrapper that execs its entry point
      # with node and stdin closed. On windows-latest the very first pnpm call
      # printed its version and then blocked on stdin forever (a first-run
      # prompt with no terminal to answer it); with stdin closed it finished in
      # seconds and every later call was fast (run 33992250969 diagnostics).
      # Corepack is disabled so its shim cannot intercept the name, and
      # pm_on_fail=error makes any version mismatch fail instead of downloading.
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        pnpm_config_update_notifier: 'false'
      run: |
        corepack disable || true
        version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
        npm install -g "pnpm@${version}"
        root="$(npm root -g)"
        bin_dir="${HOME}/.omnifrons-pnpm-bin"
        mkdir -p "${bin_dir}"
        printf '#!/usr/bin/env bash\nexec node "%s/pnpm/bin/pnpm.cjs" "$@" < /dev/null\n' "${root}" > "${bin_dir}/pnpm"
        chmod +x "${bin_dir}/pnpm"
        if [ "${RUNNER_OS}" = "Windows" ]; then cygpath -w "${bin_dir}" >> "${GITHUB_PATH}"; else echo "${bin_dir}" >> "${GITHUB_PATH}"; fi
        echo "pnpm_config_pm_on_fail=error" >> "${GITHUB_ENV}"
        echo "pnpm_config_update_notifier=false" >> "${GITHUB_ENV}"
        echo "pnpm wrapper: ${bin_dir}/pnpm -> ${root}/pnpm/bin/pnpm.cjs"
        # Bash-level time limit: `perl alarm + exec` did not fire on Windows
        # (run 33990328600 ran to the job timeout), and GNU timeout is absent
        # on macOS. Reports elapsed seconds and returns 124 on expiry.
        limited() {
          local limit="$1"; shift
          local start; start="$(date +%s)"
          "$@" & local pid=$!
          local waited=0
          while kill -0 "${pid}" 2>/dev/null && [ "${waited}" -lt "${limit}" ]; do sleep 1; waited=$((waited + 1)); done
          if kill -0 "${pid}" 2>/dev/null; then kill "${pid}" 2>/dev/null || true; wait "${pid}" 2>/dev/null || true; echo "TIMEOUT after ${limit}s: $*"; return 124; fi
          wait "${pid}"; local rc=$?
          echo "elapsed $(( $(date +%s) - start ))s (exit ${rc}): $*"; return "${rc}"
        }
        limited 90 "${bin_dir}/pnpm" --version
    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      # TODO: pin by SHA once this workflow stabilizes
      uses: actions/cache@v6 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
