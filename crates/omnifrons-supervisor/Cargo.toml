[package]
name = "omnifrons-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
omnifrons-domain = { path = "../omnifrons-domain" }
omnifrons-app = { path = "../omnifrons-app" }
tokio = { workspace = true, features = ["rt", "process", "time", "sync", "io-util"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# "signal" for `demo::unix::ignore_sigterm`; "fs" (added for the spike
# slice-2 review fixes) for `nix::fcntl::{fcntl, FcntlArg, FdFlag}`,
# clearing close-on-exec on an approved executable's sealed memfd
# immediately before `spawn_approved` execs it.
nix = { version = "0.31.3", default-features = false, features = ["signal", "fs"] }

[dev-dependencies]
omnifrons-app = { path = "../omnifrons-app", features = ["contract-tests"] }
