name: Tauri Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        # TODO: pin by SHA once this workflow stabilizes
        uses: actions/checkout@v7 # v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          linux-prereqs: 'true'
          extra-apt-packages: patchelf

      - name: cargo fmt
        if: hashFiles('rust-toolchain.toml') != ''
        run: cargo fmt --all --check

      - name: cargo clippy
        if: hashFiles('rust-toolchain.toml') != ''
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        if: hashFiles('rust-toolchain.toml') != ''
        run: cargo test --workspace --all-targets --all-features

      - name: Build renderer
        run: pnpm -r build

      - name: Build Tauri app (no publish)
        # Guarded on both files existing: the Rust toolchain must be pinned and the
        # Tauri shell (src-tauri/tauri.conf.json) must exist before packaging can run;
        # this step stays inert until a later change adds src-tauri.
        if: hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        # TODO: pin by SHA once this workflow stabilizes
        uses: tauri-apps/tauri-action@v1 # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No tagName/releaseName/releaseId: builds without creating or uploading a release.
