[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.1"

[workspace.dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-dialog = "2.7.3"
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
