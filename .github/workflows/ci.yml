name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

defaults:
  run:
    # bash on every runner, so the pnpm wrapper installed by the composite
    # action (a bash script) is what `pnpm` resolves to on Windows as well.
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The shell now compiles tauri, wry, and webkit bindings on three runners;
    # a cold cache needs the extra margin over the previous 30-minute budget.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        # TODO: pin by SHA once this workflow stabilizes
        uses: actions/checkout@v7 # v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          # omnifrons-shell (src-tauri) links WebKitGTK on ubuntu runners.
          linux-prereqs: 'true'

      - name: cargo fmt
        if: hashFiles('rust-toolchain.toml') != ''
        run: cargo fmt --all --check

      - name: cargo clippy
        if: hashFiles('rust-toolchain.toml') != ''
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        if: hashFiles('rust-toolchain.toml') != ''
        run: cargo test --workspace --all-targets --all-features

      - name: cargo test (feature-gate, no features)
        if: hashFiles('rust-toolchain.toml') != ''
        # tests/feature_gate.rs is `#![cfg(not(feature = "demo-harness"))]`:
        # the step above always passes --all-features, so it reports zero
        # tests for that file and could never catch a regression that made
        # the demo-harness feature default-on. This step runs deliberately
        # without --all-features or --features -- the only invocation that
        # actually executes that file's assertions (docs/repository-layout.md
        # § Build and test commands; src-tauri/tests/feature_gate_present.rs).
        run: cargo test -p omnifrons-shell --test feature_gate

      - name: Lint
        run: pnpm -r lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build
