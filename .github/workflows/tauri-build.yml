name: Tauri Build

on:
  workflow_dispatch:
    inputs:
      vp001_scenario:
        # Opt-in evidence run: the full VP-001 VP-S6 scenario on the pinned
        # Linux runner. Off by default, so the nightly schedule and ordinary
        # dispatches keep running only the F1 feasibility gate.
        description: Run the full VP-001 VP-S6 scenario (evidence run)
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

defaults:
  run:
    # bash on every runner, so the pnpm wrapper installed by the composite
    # action (a bash script) is what `pnpm` resolves to on Windows as well.
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named differently from ci.yml's build-test so the required status checks on
  # main never match a packaging run.
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 is pinned (not ubuntu-latest) so VP-001 evidence names an
        # exact runner image rather than a floating alias
        # (docs/evidence/VP-001 design.md § Architecture Decisions D4).
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout
        # TODO: pin by SHA once this workflow stabilizes
        uses: actions/checkout@v7 # v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          linux-prereqs: 'true'
          # xvfb, webkit2gtk-driver (WebKitWebDriver) and xdotool are the
          # Slice 3a feasibility-gate harness's own prerequisites
          # (design.md § D5/D7); only exercised on the Linux-guarded harness
          # step below. x11-utils carries xwininfo, which the harness uses to
          # corroborate that a chooser window is really viewable before
          # driving it: absent from a hosted runner by default, its ENOENT
          # cost CI run 35437413086 its whole chooser budget. openbox is a
          # minimal window manager for the VP-S6 scenario step's own Xvfb
          # display: run 35440083284 showed a genuinely mapped, viewable
          # chooser (`window_id=... map_state=IsViewable`) still rejecting
          # every keystroke with a repeated GTK-CRITICAL
          # `WIDGET_REALIZED_FOR_EVENT` assertion -- a bare Xvfb has nothing
          # to deliver the WM-mediated focus-in GTK expects before it
          # realizes a dialog's focus widget. Chosen over
          # matchbox-window-manager (built for a single fullscreen kiosk
          # window, not stacked native dialogs) and i3 (a tiling WM that
          # would resize/reposition the chooser instead of leaving it
          # floating): openbox is a conventional stacking WM, packaged for
          # ubuntu-24.04, and the standard choice for driving GTK/X11 apps
          # under a headless Xvfb in CI. x11-apps carries xwd, used only by
          # the VP-S6 scenario step's own final chooser-failure diagnostics
          # (vp-s6-xdotool.mjs's captureScreenshot) to capture the display's
          # real on-screen state alongside the transcript.
          extra-apt-packages: patchelf xvfb webkit2gtk-driver xdotool x11-utils openbox x11-apps

      - name: cargo fmt
        if: hashFiles('rust-toolchain.toml') != ''
        run: cargo fmt --all --check

      - name: cargo clippy
        if: hashFiles('rust-toolchain.toml') != ''
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        if: hashFiles('rust-toolchain.toml') != ''
        run: cargo test --workspace --all-targets --all-features

      - name: cargo test (feature-gate, no features)
        if: hashFiles('rust-toolchain.toml') != ''
        # tests/feature_gate.rs is `#![cfg(not(feature = "demo-harness"))]`:
        # the step above always passes --all-features, so it reports zero
        # tests for that file and could never catch a regression that made
        # the demo-harness feature default-on. This step runs deliberately
        # without --all-features or --features -- the only invocation that
        # actually executes that file's assertions (docs/repository-layout.md
        # § Build and test commands; src-tauri/tests/feature_gate_present.rs).
        run: cargo test -p omnifrons-shell --test feature_gate

      - name: Build renderer
        run: pnpm -r build

      - name: Build Tauri app (no publish)
        # Guarded on both files existing: the Rust toolchain must be pinned and the
        # Tauri shell (src-tauri/tauri.conf.json) must exist before packaging can run;
        # this step stays inert until a later change adds src-tauri.
        if: hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        id: tauri
        uses: tauri-apps/tauri-action@action-v1.0.0 # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No tagName/releaseName/releaseId: builds without creating or uploading a release.

      - name: Record baseline facts
        # VP-001 evidence exists only for the Linux artifact
        # (docs/evidence/VP-001 design.md § Evidence field provenance names
        # this step's exact outputs). The exact runner image version has no
        # source-confirmed environment variable on hosted runners: it is
        # transcribed by the operator from this job's own "Set up job" log
        # entry when the baseline record is authored, not captured here.
        if: runner.os == 'Linux' && hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        run: |
          set -euo pipefail
          {
            echo "## os_build / architecture (/etc/os-release, uname -rm)"
            cat /etc/os-release
            uname -rm
            echo
            echo "## webview_runtime (dpkg-query -W libwebkit2gtk-4.1-0)"
            dpkg-query -W -f='${Package} ${Version}\n' libwebkit2gtk-4.1-0
            echo
            echo "## MSRV / toolchain / Tauri patch"
            grep -m1 '^rust-version' Cargo.toml
            rustc -V
            node -v
            pnpm -v
            git --version
            cargo tree -p tauri --depth 0
          } | tee "${RUNNER_TEMP}/vp-001-baseline-facts.txt"

      - name: Digest artifact
        # AV1 (docs/evidence/VP-001 design.md § Honesty machinery) recomputes
        # this digest before the WebDriver harness runs; this step writes the
        # authoritative build_channel_digest for the retained artifact(s).
        if: runner.os == 'Linux' && hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        id: digest
        # artifactPaths reaches the shell through env, never spliced into the
        # script body: a value carrying a quote would otherwise be parsed as
        # shell. The digest file records the bare file name, because the
        # absolute runner path is provenance detail VP-001 keeps out of public
        # evidence (desktop-stack-verification-plan.md:178).
        env:
          ARTIFACT_PATHS_JSON: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          set -euo pipefail
          {
            echo 'paths<<VP001_ARTIFACT_PATHS'
            printf '%s' "${ARTIFACT_PATHS_JSON}" | jq -r '.[]'
            echo 'VP001_ARTIFACT_PATHS'
          } >> "$GITHUB_OUTPUT"
          printf '%s' "${ARTIFACT_PATHS_JSON}" | jq -r '.[]' | while IFS= read -r artifact_path; do
            printf '%s  %s\n' \
              "$(sha256sum "${artifact_path}" | cut -d' ' -f1)" \
              "$(basename "${artifact_path}")"
          done | tee "${RUNNER_TEMP}/vp-001-artifact-digest.txt"

      - name: Upload artifact
        # Retained, Digest-Addressable Artifact: the packaged Linux bundle is
        # kept rather than discarded, alongside the facts and digest that bind
        # it to VP-001 evidence (docs/evidence/VP-001 design.md § File Changes).
        if: runner.os == 'Linux' && hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        uses: actions/upload-artifact@v7.0.1 # v7.0.1
        with:
          name: vp-001-linux-baseline
          path: |
            ${{ steps.digest.outputs.paths }}
            ${{ runner.temp }}/vp-001-baseline-facts.txt
            ${{ runner.temp }}/vp-001-artifact-digest.txt
          if-no-files-found: error

      - name: Install tauri-driver
        # Pinned to the same stable release the parent verified locally
        # (2.1.0-alpha.0 exists and was deliberately not used, design.md D6
        # neighbourhood). Runs after packaging, not before: it never gates
        # the build itself.
        if: runner.os == 'Linux' && hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: VP-001 feasibility gate (AV1/AV2, F1)
        # design.md § Honesty machinery: this step mechanically proves F1
        # (tauri-driver creates a session against the retained, digest-gated
        # artifact) on every run of this job, through
        # docs/evidence/VP-001/procedures/vp-s6-linux.sh's
        # --mode=feasibility-check. F2/F3 (both GTK choosers completing, an
        # approved executable reaching an active state) are disclosed,
        # non-repository-test facts recorded separately -- Slice 3b extends
        # this step once the fixture agent and full scenario driving exist
        # (this step's own scope stops at "no scenario logic yet").
        if: runner.os == 'Linux' && hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        env:
          # Reached through env, never spliced into the script body, for the
          # same reason as the Digest artifact step's ARTIFACT_PATHS_JSON.
          VP001_DIGEST_PATHS: ${{ steps.digest.outputs.paths }}
          VP001_DIGEST_FILE: ${{ runner.temp }}/vp-001-artifact-digest.txt
        run: |
          set -euo pipefail
          artifact_path="$(printf '%s\n' "${VP001_DIGEST_PATHS}" | grep -m1 '\.AppImage$')"
          build_channel_digest="$(
            awk -v name="$(basename "${artifact_path}")" '$2 == name { print $1 }' "${VP001_DIGEST_FILE}"
          )"
          xvfb-run --auto-servernum -- bash -c '
            set -euo pipefail
            tauri-driver --native-driver /usr/bin/WebKitWebDriver &
            driver_pid=$!
            trap "kill \${driver_pid} 2>/dev/null || true" EXIT
            for _ in $(seq 1 10); do
              curl -sf http://127.0.0.1:4444/status >/dev/null 2>&1 && break
              sleep 1
            done
            docs/evidence/VP-001/procedures/vp-s6-linux.sh --mode=feasibility-check "$1" "$2"
          ' vp-s6-feasibility-check "${artifact_path}" "${build_channel_digest}" \
            | tee "${RUNNER_TEMP}/vp-001-feasibility-transcript.txt"

      - name: Build VP-S6 fixture agent
        # tools/vp-s6-agent: the native executable the scenario approves and
        # launches; its breakaway descendant exits on its own after 120s.
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.vp001_scenario && hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        run: cargo build --release -p vp-s6-agent

      - name: VP-001 VP-S6 scenario (evidence run)
        # The full scenario runs on this pinned runner, against the same
        # retained artifact the Digest artifact step recorded: VP-001 admits a
        # result only from the baseline it was run on. An `uncertain` or `fail`
        # outcome still exits 0; only the AV1/AV2 gate and usage errors fail
        # this step (vp-s6-linux.sh header).
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.vp001_scenario && hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        env:
          VP001_DIGEST_PATHS: ${{ steps.digest.outputs.paths }}
          VP001_DIGEST_FILE: ${{ runner.temp }}/vp-001-artifact-digest.txt
          # Read by vp-s6-xdotool.mjs's captureScreenshot on a final chooser
          # failure only; unset elsewhere, so nothing shells out to `xwd`
          # outside this step.
          VP001_DIAGNOSTIC_SCREENSHOT_PATH: ${{ runner.temp }}/vp-001-vp-s6-chooser-failure.xwd
        run: |
          set -euo pipefail
          artifact_path="$(printf '%s\n' "${VP001_DIGEST_PATHS}" | grep -m1 '\.AppImage$')"
          build_channel_digest="$(
            awk -v name="$(basename "${artifact_path}")" '$2 == name { print $1 }' "${VP001_DIGEST_FILE}"
          )"
          workspace_dir="$(mktemp -d "${RUNNER_TEMP}/vp-s6-workspace.XXXXXX")"
          # Seed exactly one GTK3 places-sidebar bookmark naming
          # workspace_dir, so the "Select Folder" dialog's own `Alt+1`
          # accelerator (vp-s6-xdotool.mjs's `bookmark-jump` strategy, tried
          # first for this chooser) can jump straight there with no typing
          # and no Ctrl+L. Verified locally against the real packaged
          # AppImage (see that module's own header): the launching process's
          # cwd, HOME, and a pre-set APPDIR were all tried first and none
          # steer the dialog away from the AppImage runtime's own forced
          # internal chdir target, but this bookmark -- read via $HOME,
          # independent of that forced cwd -- reliably does.
          mkdir -p "${HOME}/.config/gtk-3.0"
          printf 'file://%s\n' "${workspace_dir}" > "${HOME}/.config/gtk-3.0/bookmarks"
          xvfb-run --auto-servernum -- bash -c '
            set -euo pipefail
            # A minimal window manager, not the feasibility-gate step above:
            # that step never drives a chooser, only this one does. Started
            # first and given its own readiness wait (xprop, from x11-utils
            # already installed above) so it has taken the WM_S0 selection
            # before the app launches into this display.
            openbox &
            wm_pid=$!
            trap "kill \${wm_pid} 2>/dev/null || true" EXIT
            for _ in $(seq 1 10); do
              xprop -root _NET_SUPPORTING_WM_CHECK >/dev/null 2>&1 && break
              sleep 1
            done
            tauri-driver --native-driver /usr/bin/WebKitWebDriver &
            driver_pid=$!
            trap "kill \${driver_pid} \${wm_pid} 2>/dev/null || true" EXIT
            for _ in $(seq 1 10); do
              curl -sf http://127.0.0.1:4444/status >/dev/null 2>&1 && break
              sleep 1
            done
            docs/evidence/VP-001/procedures/vp-s6-linux.sh --mode=scenario "$1" "$2" "$3" "$4"
          ' vp-s6-scenario "${artifact_path}" "${build_channel_digest}" \
            "${GITHUB_WORKSPACE}/target/release/vp-s6-agent" "${workspace_dir}" \
            | tee "${RUNNER_TEMP}/vp-001-vp-s6-transcript.txt"

      - name: Upload VP-001 transcripts
        # Kept even when a gate fails: a blocked run is evidence of the
        # blocker, not something to discard. The .xwd screenshot only exists
        # when the VP-S6 scenario step's own chooser driving exhausted every
        # strategy (vp-s6-xdotool.mjs's captureScreenshot); a run artifact
        # only, never committed to the repository.
        if: always() && runner.os == 'Linux' && hashFiles('rust-toolchain.toml') != '' && hashFiles('src-tauri/tauri.conf.json') != ''
        uses: actions/upload-artifact@v7.0.1 # v7.0.1
        with:
          name: vp-001-transcripts
          path: |
            ${{ runner.temp }}/vp-001-feasibility-transcript.txt
            ${{ runner.temp }}/vp-001-vp-s6-transcript.txt
            ${{ runner.temp }}/vp-001-vp-s6-chooser-failure.xwd
          if-no-files-found: warn
