[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98.1"

[workspace.dependencies]
thiserror = "2.0.20"
tokio = "1.53.1"
tracing = "0.1.44"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

[workspace.lints.rust]
unsafe_code = "deny"
